plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.81'
}

def incrementPatchVersion = { String currentVersion ->
    def segments = currentVersion.tokenize('.')
    if (segments.size() != 3 || !segments.every { it.isInteger() }) {
        throw new GradleException("mod_version must use major.minor.patch format: ${currentVersion}")
    }
    "${segments[0]}.${segments[1]}.${segments[2].toInteger() + 1}"
}

def nextModVersion = incrementPatchVersion(project.mod_version)
version = nextModVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
        }
        data {
            type = 'data'
            programArguments.addAll '--mod', 'kunjinkao', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        kunjinkao {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = 'file://' + System.getenv('local_maven') ?: "$buildDir/repo"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: nextModVersion,
            mod_authors: mod_authors, mod_description: mod_description,
            pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    // src/generated/resources 目前只放一个 .gitkeep 占位，不要把占位文件打进 jar。
    exclude '.gitkeep'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('build').configure {
    doLast {
        def propertiesFile = file('gradle.properties')
        propertiesFile.text = propertiesFile.getText('UTF-8').replaceFirst(
                /(?m)^mod_version=.*/,
                "mod_version=${nextModVersion}"
        )
    }
}
// ---------------------------------------------------------------------------
// 构建完成后把 mod jar 复制到项目根目录，省得每次手动去 build/libs 里翻。
// 只复制主 jar；-sources.jar 不复制。根目录的 jar 已被 .gitignore 的 /*.jar 忽略。
// doNotTrackState：目标目录就是项目根目录，里面有 Gradle 自己的 .gradle 锁文件，
// 无法做增量状态跟踪（否则报 "destination directory contains unreadable content"）。
// ---------------------------------------------------------------------------
tasks.register('copyModJarToRoot', Copy) {
    dependsOn tasks.named('jar')
    onlyIf { tasks.named('jar').get().archiveFile.get().asFile.exists() }
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory
    doNotTrackState('copies into the project root, which holds Gradle lock files')
}

tasks.named('build').configure {
    finalizedBy 'copyModJarToRoot'
}
