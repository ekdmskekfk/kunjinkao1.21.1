plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.81'
}

def incrementPatchVersion = { String currentVersion ->
    def segments = currentVersion.tokenize('.')
    if (segments.size() != 3 || !segments.every { it.isInteger() }) {
        throw new GradleException("mod_version must use major.minor.patch format: ${currentVersion}")
    }
    "${segments[0]}.${segments[1]}.${segments[2].toInteger() + 1}"
}

def nextModVersion = incrementPatchVersion(project.mod_version)
// 只有显式 -PautoBump 才把补丁号推进一位；否则直接用 gradle.properties 里的值。
// 否则默认构建会产出"属性值+1"的版本，属性值又停在上次 autoBump 的位置，
// 导致版本号可倒退、同名不同内容覆盖已有 jar（审计指出）。
def autoBump = providers.gradleProperty('autoBump').isPresent()
def buildVersion = autoBump ? nextModVersion : project.mod_version
version = buildVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    // JEI 的官方 maven（只为编译期提供 IGhostIngredientHandler 等接口，运行时不打包进去）
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kunjinkao'
        }
        data {
            type = 'data'
            programArguments.addAll '--mod', 'kunjinkao', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        kunjinkao {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
}

dependencies {
    // JEI：只做编译期依赖（compileOnly）+ 运行时由玩家自备。
    // 用 "19.+" 让 Gradle 解析 1.21.1 对应的最新 19.x；确认无误后可以钉成具体版本。
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.+"

    // AE2 与 neoecoae：同样只做编译期依赖。
    // 需要它们是因为给 neoecoae 打的补丁 mixin 要声明一个带 AE2 类型的方法
    // （neoecoae$insertIntoCpuForJob(UUID, AEKey, long, Actionable)），
    // 方法签名必须逐字一致才织得进去。
    // libs/ 已加进 .gitignore —— 这两个 jar 不进仓库，克隆后需自行放入。
    compileOnly files(
            "libs/appliedenergistics2-19.2.17.jar",
            "libs/neoecoae-21.2.0.jar"
    )
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = 'file://' + System.getenv('local_maven') ?: "$buildDir/repo"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: buildVersion,
            mod_authors: mod_authors, mod_description: mod_description,
            pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    // src/generated/resources 目前只放一个 .gitkeep 占位，不要把占位文件打进 jar。
    exclude '.gitkeep'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// ---------------------------------------------------------------------------
// 版本号回写是**可选**的：只有显式传 -PautoBump 时才把 gradle.properties 的
// mod_version 改写成本次构建的版本（nextModVersion）。
// 不传时版本号保持仓库里的值不动，工作区不会被每次 build 弄脏；jar 文件名与
// jar 内 neoforge.mods.toml 的版本仍然一致（二者都取自 nextModVersion）。
//   gradle build -PautoBump         构建并自增（本仓库的 gradlew 不可用，见结构报告 1.1）
//   gradle build                    仅构建，不回写
// ---------------------------------------------------------------------------
tasks.named('build').configure {
    doLast {
        if (!providers.gradleProperty('autoBump').isPresent()) {
            return
        }
        def propertiesFile = file('gradle.properties')
        propertiesFile.text = propertiesFile.getText('UTF-8').replaceFirst(
                /(?m)^mod_version=.*/,
                "mod_version=${nextModVersion}"
        )
    }
}

// ---------------------------------------------------------------------------
// 构建完成后把 mod jar 复制到指定目录（默认 F:/mcmodli/tang/neoforge1.21.1mod，
// 可用 -PmodJarDir=... 或在 ~/.gradle/gradle.properties 里覆盖）。
// 只复制主 jar，-sources.jar 不复制。
// doNotTrackState：目标目录由用户指定，可能含 Gradle 读不动的文件，跳过状态跟踪。
// 非 Windows（例如 CI）只在目标目录已存在时才复制，避免创建无关目录。
// ---------------------------------------------------------------------------
def modJarDir = providers.gradleProperty('modJarDir').getOrElse('F:/mcmodli/tang/neoforge1.21.1mod')
def isWindowsHost = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('copyModJar', Copy) {
    dependsOn tasks.named('jar')
    onlyIf {
        def source = tasks.named('jar').get().archiveFile.get().asFile
        source.exists() && (isWindowsHost || file(modJarDir).exists())
    }
    from tasks.named('jar').flatMap { it.archiveFile }
    into file(modJarDir)
    doNotTrackState('目标目录由用户指定，可能包含 Gradle 无法读取的文件')
}

tasks.named('build').configure {
    finalizedBy 'copyModJar'
}

// ★ 关键：jar 的 MANIFEST 里必须有 MixinConfigs，否则 NeoForge 的 mixin 代理
//   （FMLMixinPlatformAgent）会直接 reject 这个容器，mixin 静默不生效。
//   判断依据来自实例日志：
//     [mixin/]: FMLMixinPlatformAgent rejected container SecureJarResource(kunjinkao)
//   只写 neoforge.mods.toml 的 [[mixins]] 是不够的 —— 那条声明本身没错，
//   但真正的注册入口是 manifest 属性。
//   没有这个方法引用混淆成员（只是实现一个接口 + 反射），因此不需要 refmap。
jar {
    manifest {
        attributes(['MixinConfigs': 'kunjinkao.mixins.json'])
    }
}
// ---------------------------------------------------------------------------
// 构建完成后部署到测试实例：复制主 jar，并删掉那里旧的 kunjinkao 版本。
//
//   gradle build                          构建 + 自动部署
//   gradle build -PtestInstanceModsDir=.. 换目标目录
//
// 只删 kunjinkao*.jar —— 同目录下别人的模组一个都不碰。
// 目标目录不存在时只打一行日志跳过（比如换机器、或那个实例被删了）。
// 目标目录在工程之外，且可能含 Gradle 读不动的文件，因此不参与状态跟踪。
// ---------------------------------------------------------------------------
def testInstanceModsDir = providers.gradleProperty('testInstanceModsDir')
        .getOrElse('F:/mcc/mc/.minecraft/versions/1.21.1mod测试/mods')

tasks.register('deployToTestInstance') {
    group = 'build'
    description = '把构建出的主 jar 复制到测试实例的 mods 目录，并删除其中的旧 kunjinkao 版本'
    dependsOn tasks.named('jar')
    doNotTrackState('目标目录在工程之外，且可能含 Gradle 读不动的文件')

    def jarProvider = tasks.named('jar').flatMap { it.archiveFile }
    def targetDir = file(testInstanceModsDir)

    onlyIf { jarProvider.get().asFile.exists() }

    doLast {
        def jar = jarProvider.get().asFile
        if (!targetDir.exists()) {
            logger.lifecycle("[deploy] 目标目录不存在，跳过：${targetDir}")
            return
        }
        // 1) 删旧的 kunjinkao（保留本次要部署的同名文件，避免白删一遍）
        def stale = targetDir.listFiles({ f ->
            f.isFile() && f.name.startsWith('kunjinkao') && f.name.endsWith('.jar') && f.name != jar.name
        } as FileFilter)
        (stale ?: new File[0]).sort { it.name }.each { old ->
            if (old.delete()) {
                logger.lifecycle("[deploy] 删除旧版 ${old.name}")
            } else {
                logger.warn("[deploy] 删不掉 ${old.name} —— 游戏可能正开着")
            }
        }
        // 2) 复制
        java.nio.file.Files.copy(jar.toPath(), new File(targetDir, jar.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[deploy] 已部署 ${jar.name} -> ${targetDir}")
        def now = targetDir.listFiles({ f ->
            f.isFile() && f.name.startsWith('kunjinkao') && f.name.endsWith('.jar')
        } as FileFilter)
        logger.lifecycle("[deploy] 该目录现有 kunjinkao：${(now ?: new File[0])*.name}")
    }
}

tasks.named('build').configure {
    finalizedBy 'deployToTestInstance'
}