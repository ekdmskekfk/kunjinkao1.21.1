name: Build and prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two pushes cannot race on the shared `prerelease` tag.
concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Deliberately invoke the Gradle installed here instead of `./gradlew`.
      # The committed gradlew/gradlew.bat on this machine are patched to launch a
      # local <project>/lib Gradle distribution that is not part of the repository,
      # so they cannot run on a clean CI checkout.
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle build --stacktrace

      # build.gradle also emits a -sources.jar next to the mod jar; release only the mod jar.
      - name: Collect release jar
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp -v {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No mod jar found in build/libs"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunjinkao-neoforge-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          name: Development prerelease
          prerelease: true
          make_latest: false
          files: dist/*.jar
